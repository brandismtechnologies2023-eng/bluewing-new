<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BlueWing Admin</title>
<link rel="stylesheet" href="/new-pillar/admin.css">
</head>
<body>

<div id="login-screen" class="login-wrap">
  <form id="login-form" class="login-card">
    <img class="brand-logo" src="/assets/BlueWing-logo-2026.svg" alt="BlueWing Group">
    <p class="sub">Sign in to manage the website</p>
    <label>Username
      <input type="text" id="login-username" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
    <p id="login-error" class="error-msg" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><img class="brand-logo brand-logo--dark" src="/assets/BlueWing-logo-2026.svg" alt="BlueWing Group"><span>Admin</span></div>
    <nav>
      <button class="nav-item is-active" data-tab="blog">Blog</button>
      <button class="nav-item" data-tab="projects">Projects</button>
      <button class="nav-item" data-tab="careers">Careers — Current Openings</button>
    </nav>
    <button id="logout-btn" class="btn btn-ghost logout-btn">Log out</button>
  </aside>

  <main class="content">

    <!-- BLOG TAB -->
    <section class="tab-panel is-active" id="tab-blog">
      <div class="panel-head">
        <h2>Blog posts</h2>
        <button class="btn btn-primary" id="blog-new-btn">+ New blog post</button>
      </div>
      <div class="list" id="blog-list"></div>
    </section>

    <!-- PROJECTS TAB -->
    <section class="tab-panel" id="tab-projects">
      <div class="panel-head">
        <h2>Projects</h2>
        <button class="btn btn-primary" id="projects-new-btn">+ New project</button>
      </div>
      <div class="list" id="projects-list"></div>
    </section>

    <!-- CAREERS TAB -->
    <section class="tab-panel" id="tab-careers">
      <div class="panel-head">
        <h2>Current openings</h2>
        <button class="btn btn-primary" id="careers-new-btn">+ New opening</button>
      </div>
      <div class="list" id="careers-list"></div>
    </section>

  </main>
</div>

<!-- ===== BLOG EDITOR MODAL ===== -->
<div class="modal" id="blog-modal" hidden>
  <div class="modal-box modal-wide">
    <div class="modal-head">
      <h3 id="blog-modal-title">New blog post</h3>
      <button class="modal-x" data-close="blog-modal">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="blog-id">
      <label>Title
        <input type="text" id="blog-title" required>
      </label>
      <label>Excerpt (short summary shown on blog list)
        <textarea id="blog-excerpt" rows="2"></textarea>
      </label>

      <div class="row-2">
        <label>Category
          <input type="text" id="blog-category" list="blog-category-list" placeholder="e.g. Construction Industry">
          <datalist id="blog-category-list"></datalist>
        </label>
        <label>Tags (comma separated)
          <input type="text" id="blog-tags" placeholder="e.g. precast, ahmedabad, epc">
        </label>
      </div>

      <label>Content
        <div class="rte" id="blog-content-rte"></div>
      </label>

      <fieldset class="media-type-fs">
        <legend>Media / display layout</legend>
        <div class="media-type-opts">
          <label class="radio-pill"><input type="radio" name="blog-media-type" value="grid" checked> Only grid</label>
          <label class="radio-pill"><input type="radio" name="blog-media-type" value="gallery-grid"> Image gallery grid</label>
          <label class="radio-pill"><input type="radio" name="blog-media-type" value="slider"> Image slider</label>
          <label class="radio-pill"><input type="radio" name="blog-media-type" value="video"> Video</label>
        </div>
      </fieldset>

      <div id="blog-media-images-wrap">
        <label>Images</label>
        <div class="uploader" id="blog-images-uploader">
          <div class="thumbs" id="blog-images-thumbs"></div>
          <input type="file" id="blog-images-input" accept="image/*" multiple>
        </div>
      </div>

      <div id="blog-media-video-wrap" hidden>
        <label>Video URL (YouTube link, or direct .mp4)
          <input type="text" id="blog-video-url" placeholder="https://youtube.com/watch?v=...">
        </label>
      </div>

      <label class="checkbox-row"><input type="checkbox" id="blog-published" checked> Published (visible on site)</label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="blog-modal">Cancel</button>
      <button class="btn btn-primary" id="blog-save-btn">Save post</button>
    </div>
  </div>
</div>

<!-- ===== PROJECT EDITOR MODAL ===== -->
<div class="modal" id="project-modal" hidden>
  <div class="modal-box modal-wide">
    <div class="modal-head">
      <h3 id="project-modal-title">New project</h3>
      <button class="modal-x" data-close="project-modal">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="project-id">
      <label>Title
        <input type="text" id="project-title" required>
      </label>

      <div class="row-2">
        <label>Status
          <select id="project-status">
            <option>Ongoing</option>
            <option>Completed</option>
          </select>
        </label>
        <label>Category
          <input type="text" id="project-category" list="project-category-list" placeholder="e.g. Residential">
          <datalist id="project-category-list"></datalist>
        </label>
      </div>
      <label>Tags (comma separated)
        <input type="text" id="project-tags" placeholder="e.g. epc, ahmedabad">
      </label>

      <label>Content / description
        <div class="rte" id="project-content-rte"></div>
      </label>

      <label>Images</label>
      <div class="uploader" id="project-images-uploader">
        <div class="thumbs" id="project-images-thumbs"></div>
        <input type="file" id="project-images-input" accept="image/*" multiple>
      </div>

      <div class="table-editor-wrap">
        <label>Specification table</label>
        <div class="table-editor-toolbar">
          <button type="button" class="btn btn-sm" id="table-add-row">+ Row</button>
          <button type="button" class="btn btn-sm" id="table-add-col">+ Column</button>
          <button type="button" class="btn btn-sm" id="table-remove-row">- Row</button>
          <button type="button" class="btn btn-sm" id="table-remove-col">- Column</button>
        </div>
        <div class="table-editor-scroll">
          <table id="project-table-editor"></table>
        </div>
      </div>

      <label class="checkbox-row"><input type="checkbox" id="project-published" checked> Published (visible on site)</label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="project-modal">Cancel</button>
      <button class="btn btn-primary" id="project-save-btn">Save project</button>
    </div>
  </div>
</div>

<!-- ===== CAREER EDITOR MODAL ===== -->
<div class="modal" id="career-modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="career-modal-title">New opening</h3>
      <button class="modal-x" data-close="career-modal">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="career-id">
      <label>Job title
        <input type="text" id="career-title" required placeholder="e.g. Site Engineer — Civil">
      </label>
      <div class="row-2">
        <label>Tag / department
          <input type="text" id="career-tag" placeholder="e.g. Site Engineering">
        </label>
        <label>Job type
          <select id="career-type">
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Contract</option>
            <option>Internship</option>
          </select>
        </label>
      </div>
      <div class="row-2">
        <label>Location
          <input type="text" id="career-location" value="Ahmedabad">
        </label>
        <label>Apply email
          <input type="text" id="career-email" value="careers@bluewingconstruction.com">
        </label>
      </div>
      <label>Description
        <div class="rte" id="career-content-rte"></div>
      </label>
      <label class="checkbox-row"><input type="checkbox" id="career-active" checked> Active (visible on site)</label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="career-modal">Cancel</button>
      <button class="btn btn-primary" id="career-save-btn">Save opening</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/new-pillar/admin.js"></script>
</body>
</html>
